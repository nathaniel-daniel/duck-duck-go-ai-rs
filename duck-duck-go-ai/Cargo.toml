[package]
name = "duck-duck-go-ai"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = { version = "0.22.1", default-features = false }
ego-tree = { version = "0.10.0", default-features = false }
futures-util = { version = "0.3.31", default-features = false }
markup5ever = "0.14.1"
nd-tokio-sse-codec = { git = "https://github.com/nathaniel-daniel/nd-tokio-sse-codec-rs", version = "0.0.0" }
reqwest = { version = "0.12.22", features = [ "http2", "json", "stream" ], default-features = false }
rquickjs = { version = "0.9.0", features = [ "macro" ], default-features = false }
scraper = { version = "0.23.1", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = "1.47.1"
tokio-stream = { version = "0.1.17", default-features = false }
tokio-util = { version = "0.7.16", default-features = false }

[features]
default = [
    "rustls-tls"
]
native-tls = [
    "reqwest/native-tls",
]
rustls-tls = [
    "reqwest/rustls-tls",
]

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros"] }
